<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Cole aqui o CSS luxuoso que te mandei antes */
        :root { --bg-gradient: linear-gradient(135deg, #0f1115 0%, #1a1d26 100%); --gold: #d4af37; --text-main: #ffffff; --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); }
        body { margin: 0; font-family: 'Outfit', sans-serif; background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 500px; padding: 20px; }
        .card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px; }
        .header h1 { font-family: 'Playfair Display', serif; text-align: center; color: var(--gold); }
        label { color: var(--gold); display: block; margin: 10px 0 5px; font-size: 0.8rem; }
        input, select, textarea { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .btn-submit { width: 100%; background: var(--gold); border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; padding: 10px 20px; border-radius: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <h1>Cronograma de Oficina</h1>
            <p style="text-align:center; color:#8b9bb4">Registro de atividades diárias</p>
        </div>

        <form id="formAtividade">
            <label>Descrição da Atividade</label>
            <textarea id="descricao" required placeholder="Ex: Manutenção predial/hidráulica..."></textarea>

            <div style="display:flex; gap:10px">
                <div style="flex:1">
                    <label>Início</label>
                    <input type="time" id="horaInicio" required>
                </div>
                <div style="flex:1">
                    <label>Fim</label>
                    <input type="time" id="horaFim" required>
                </div>
            </div>

            <label>Quantidade de Pessoas</label>
            <select id="qtdPessoas" onchange="gerarCamposNomes()">
                <option value="0">Selecione...</option>
                <option value="1">1 Pessoa</option>
                <option value="2">2 Pessoas</option>
                <option value="3">3 Pessoas</option>
            </select>

            <div id="containerNomes"></div>

            <button type="submit" class="btn-submit" id="btnEnviar">REGISTRAR ATIVIDADE</button>
        </form>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    // COLORA AQUI A URL QUE VOCÊ COPIOU DO GOOGLE APPS SCRIPT
    const WEB_APP_URL = "SUA_URL_AQUI_DO_GOOGLE_SCRIPT";

    let listaNomes = [];

    // Busca nomes ao carregar
    async function carregarNomes() {
        try {
            const response = await fetch(WEB_APP_URL);
            listaNomes = await response.json();
        } catch (e) {
            console.error("Erro ao carregar nomes", e);
        }
    }
    carregarNomes();

    function gerarCamposNomes() {
        const qtd = document.getElementById('qtdPessoas').value;
        const container = document.getElementById('containerNomes');
        container.innerHTML = '';
        for(let i=0; i<qtd; i++) {
            let select = document.createElement('select');
            select.className = "nome-colaborador";
            select.required = true;
            select.innerHTML = `<option value="">Selecione o Colaborador ${i+1}</option>` + 
                               listaNomes.map(n => `<option value="${n}">${n}</option>`).join('');
            container.appendChild(select);
        }
    }

    document.getElementById('formAtividade').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnEnviar');
        btn.innerText = "ENVIANDO...";
        btn.disabled = true;

        const nomes = Array.from(document.querySelectorAll('.nome-colaborador')).map(s => s.value);
        
        const dados = {
            descricao: document.getElementById('descricao').value,
            horaInicio: document.getElementById('horaInicio').value,
            horaFim: document.getElementById('horaFim').value,
            equipe: nomes.join(', ')
        };

        try {
            // Envia para o Google via POST
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // Necessário para evitar erro de redirecionamento do Google
                cache: 'no-cache',
                body: JSON.stringify(dados)
            });

            showToast("Sucesso! Atividade registrada.");
            document.getElementById('formAtividade').reset();
            document.getElementById('containerNomes').innerHTML = '';
        } catch (err) {
            showToast("Erro ao enviar dados.");
        } finally {
            btn.innerText = "REGISTRAR ATIVIDADE";
            btn.disabled = false;
        }
    });

    function showToast(txt) {
        const t = document.getElementById('toast');
        t.innerText = txt;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }
</script>
</body>
</html>
